[project]
name = "webmate-sdk"
version = "0.1.0"
description = "Python SDK analogous to the webmate Java SDK"
authors = [
  {name = "webmate"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
